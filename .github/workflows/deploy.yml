# 本番適用。main に merge / push されたら wrangler deploy する。
# 公開 repo は private repo（bytask/tskf）の再利用可能ワークフローを呼べないので、
# 型（tskf 01-operations/playbooks/infra/dev-flow.md）を写してある。直すときは両方。
# 必要な secret: CLOUDFLARE_API_TOKEN（Workers 編集）
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-production
  cancel-in-progress: false
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: cf2700fea05294e9282d2323a28c0322
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: wrangler types
        run: npx wrangler types
      - run: npx tsc --noEmit
      - name: wrangler deploy
        run: npx wrangler deploy
